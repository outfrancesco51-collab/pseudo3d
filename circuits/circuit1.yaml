        # --- Recta final (empieza a abrirse hacia la meta) ---
        {command: "S", segments: 35},
        {command: "O", img: "arbusto", step: 4.0, offset: 0.0, x: -1.5, random_x: -0.20, random_step: 0.9, collidable: false},
        {command: "O", img: "arbusto", step: 4.5, offset: 2.0, x: 1.5, random_x: 0.20, random_step: 0.9, collidable: false},
