        {command: "S", segments: 20},
        {command: "V", img: "vegetacion.2", x: 2.0, step_x: 1.0, step_z: 4.5, offset: 0.5, number: 2},
        {command: "F", img: "arbol", x: 1.6, step_x: 0.8, step_z: 8.0, offset: 2.0, number: 2, random_x: 0.25, random_step: 2.0},
        {command: "F", img: "arbol.2", x: 2.0, step_x: 0.9, step_z: 10.0, offset: 6.0, number: 1, random_x: 0.25, random_step: 2.0},
        {command: "F", img: "arbol.3", x: 10.0, step_x: 1.0, step_z: 2.5, offset: 1.0, number: 1, random_x: 0.75, random_step: 1.5},

        {command: "O", img: "rasante", step: 30.0, offset: 17.0, x: -1.4, collidable: true},
        {command: "O", img: "rasante", step: 30.0, offset: 17.0, x: 1.4, collidable: true},

        {command: "BMP", repeats: 3, segments: 4, slope: 0.025},

        {command: "V", img: "vegetacion.3", x: 2.1, step_x: 1.0, step_z: 4.0, offset: 0.0, number: 2},
        {command: "F", img: "arbol.3", x: 3.2, step_x: 1.0, step_z: 10.0, offset: 2.0, number: 1, random_x: 0.30, random_step: 2.0},
        {command: "F", img: "arbol.4", x: 3.4, step_x: 1.0, step_z: 12.0, offset: 7.0, number: 1, random_x: 0.30, random_step: 2.0},
        {command: "F", img: "arbol.2", x: 10.0, step_x: 1.0, step_z: 2.5, offset: 0.0, number: 1, random_x: 0.75, random_step: 1.5},

        {command: "S", segments: 20},
        {command: "O", img: "cartel.1", segments: 9, step: 2.0, offset: 0.0, x: -1.9, collidable: false},
        {command: "O", img: "cartel.2", step: 2.0, offset: 10.0, x: -1.9, collidable: false},
        {command: "O", img: "cartel.3", segments: 9, step: 2.0, offset: 0.0, x: 1.9, collidable: false},
        {command: "O", img: "cartel.4", step: 2.0, offset: 10.0, x: 1.9, collidable: false},
        {command: "F", img: "arbol.4", x: 10.0, step_x: 1.0, step_z: 2.5, offset: 1.0, number: 1, random_x: 0.75, random_step: 1.5},

        {command: "S", segments: 25},
        {command: "V", img: "vegetacion.2", x: 2.05, step_x: 1.0, step_z: 5.0, offset: 0.5, number: 2},
        {command: "F", img: "arbol.2", x: 1.7, step_x: 0.8, step_z: 9.0, offset: 2.0, number: 2, random_x: 0.25, random_step: 2.5},
